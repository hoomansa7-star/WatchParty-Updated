name: Sync to Second GitHub

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Second GitHub
        env:
          DEST_TOKEN: ${{ secrets.SECOND_GITHUB_TOKEN }}
        run: |
          git push --force https://${DEST_TOKEN}@github.com/engineersa277/WatchParty-Updated.git HEAD:main
